name: Disziplinarmanagement – Abmahnungen anzeigen
on:
  push:
    branches: [main, migration/mysql]
  pull_request:
    branches: [main]
jobs:
  disziplin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test six-slot disciplinary archive and document generation
        run: |
          node --check src/dokumentApi.js
          node --test tests/disziplin-sichtbarkeit.test.mjs
