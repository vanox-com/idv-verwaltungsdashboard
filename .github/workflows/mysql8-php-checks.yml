name: MySQL 8 / PHP backend syntax checks
on:
  push:
    branches:
      - migration/mysql
      - migration/mysql8-php-cutover-2026-11-10
  pull_request:
    branches:
      - main
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, pdo_mysql
      - name: Check PHP version and syntax
        run: |
          php -v
          for f in public/api.php php/*.php; do
            php -l "$f" || exit 1
          done
      - name: Test training master-personnel rank mapping
        run: php tests/mysql8-ausbildung-personal.php
      - name: Check Ausbildung and Unterricht browser JavaScript
        run: |
          node --check public/assets/ausbildung-panel.js
          node --check public/assets/unterricht-raum.js
          node --check public/assets/pruefungszentrum.js
          node --check public/assets/pruefung-gast.js
          php tests/pruefungen-logic.php
      - name: Test CopNet managed encryption key and legacy compatibility
        run: php tests/mysql8-copnet-managed.php
      - name: Test Google OAuth origin validation and safe diagnostics
        run: php tests/mysql8-google-origin.php
      - name: Verify private DOCX template importer
        run: php tests/mysql8-private-templates.php
      - name: Check minimal Google Drive scope in browser
        run: |
          ! grep -Fq 'drive.readonly' public/dokumentUI.js public/index.html
      - name: Confirm reviewed MySQL schema structure
        run: |
          test "$(grep -c '^CREATE TABLE ' scripts/mysql/mysql8-schema.sql)" -eq 48
          test "$(grep -c ' FOREIGN KEY (' scripts/mysql/mysql8-schema.sql)" -eq 33
          test "$(grep -c ' CHECK (' scripts/mysql/mysql8-schema.sql)" -eq 14
          test "$(grep -c '^CREATE TRIGGER ' scripts/mysql/mysql8-revisions.sql)" -eq 8
