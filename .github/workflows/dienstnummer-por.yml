name: Dienstnummern-POR-Freigabe – Tests
on:
  push:
    branches: [main, migration/mysql]
  pull_request:
    branches: [main]
jobs:
  dienstnummer-por:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safe service-number applications and approvals
        run: node --test tests/dienstnummer-antraege.test.mjs tests/dienstnummer-refresh.test.mjs
