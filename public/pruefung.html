<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Prüfung · IdentityValley</title>
<link rel="icon" href="/assets/idv-verwaltung-favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#101a28;color:#edf3fb;font:15px/1.55 system-ui,sans-serif;min-height:100dvh}header{position:sticky;top:0;z-index:2;background:#101b2bf5;border-bottom:1px solid #354966;padding:13px max(18px,calc((100% - 920px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header img{max-width:124px;max-height:50px}#clock{font-variant-numeric:tabular-nums;font-size:25px;font-weight:750;color:#f4ce8e;white-space:nowrap}main{max-width:920px;margin:auto;padding:22px 18px 60px}.card{border:1px solid #34485e;background:#18283c;border-radius:13px;padding:20px;margin:12px 0}h1{font-size:clamp(22px,4vw,34px);margin:6px 0}h2{font-size:20px}p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#afc0d3}button{font:inherit;font-weight:650;color:#eef5fc;background:#315e8b;border:1px solid #628db7;border-radius:8px;padding:10px 17px;cursor:pointer}button:disabled{opacity:.5;cursor:default}textarea{width:100%;min-height:130px;background:#0e1c2c;color:inherit;border:1px solid #506783;border-radius:8px;padding:12px;font:inherit}label.option{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#102035;border:1px solid #34485e;border-radius:8px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}input{accent-color:#77b8fc}#progress{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}#progress button{min-width:34px;padding:6px;background:#22374e}#progress button.done{background:#214e41}#progress button.active{outline:2px solid #8ac1fc}.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#message{min-height:1.5em;color:#b5d9ef;white-space:pre-wrap}.error{color:#ffb5b5!important}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #91bfff;outline-offset:3px}
</style></head><body>
<header><div><img src="/assets/idv-polizei-logo-transparent.svg" alt="Polizei IdentityValley"><div class="muted">Ausbildungs- und Lehrkommission</div></div><div id="clock" aria-live="off"></div></header>
<main><h1 id="title">Digitale Prüfung</h1><p id="message" role="status">Prüfungslink wird geprüft …</p><div id="root"></div></main>
